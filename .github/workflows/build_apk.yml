name: Build Android APK

on:
  push:
    branches: [ master, main, debug-fix ]
  pull_request:
    branches: [ master, main, debug-fix ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  checks: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.29.0'
        channel: 'stable'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Accept Android licenses
      run: yes | flutter doctor --android-licenses || true
      
    - name: Get dependencies
      run: flutter pub get
      
    - name: Build APK (release)
      run: flutter build apk --release
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        
    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/debug-fix' || github.ref == 'refs/heads/main'
      with:
        files: build/app/outputs/flutter-apk/app-release.apk
        tag_name: v1.0.0-build-${{ github.run_number }}
        name: NieuwsApp Build ${{ github.run_number }}
        body: |
          Automated build from ${{ github.ref_name }} branch
          - Flutter 3.29.0
          - Proguard fixes applied
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}