name: nieuws_app
description: "Nieuws app - Flutter nieuws app met NU.nl design"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP & API
  dio: ^5.4.0
  http: ^1.2.0
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # State Management
  provider: ^6.1.1
  
  # Image Caching
  cached_network_image: ^3.3.1
  
  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.2.5
  share_plus: ^7.2.2
  html_unescape: ^2.0.0
  
  # UI
  shimmer: ^3.0.0
  pull_to_refresh: ^2.0.0
  
  # Notifications
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/logo.png
    
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
