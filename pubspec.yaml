name: plusnews
description: "PlusNews - Nieuws aggregator app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.0
  xml: ^7.0.1
  cached_network_image: ^3.3.0
  url_launcher: ^6.2.0
  provider: ^6.1.0
  intl: ^0.20.2
  shared_preferences: ^2.2.0
  google_fonts: ^8.1.0
  animations: ^2.0.0
  share_plus: ^13.1.0
  geolocator: ^14.0.3
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.0
  flutter_inappwebview: ^6.0.0
  dynamic_color: ^1.5.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true