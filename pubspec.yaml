name: plusnews
description: "PlusNews - Nieuws aggregator app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.0
  xml: ^6.5.0
  cached_network_image: ^3.3.0
  url_launcher: ^6.2.0
  provider: ^6.1.0
  intl: ^0.20.2
  shared_preferences: ^2.2.0
  share_plus: ^7.2.2
  geolocator: ^10.1.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_inappwebview: ^6.0.0
  dynamic_color: ^1.5.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true